name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Dépendances de test
        run: npm ci
      - name: Vérification syntaxe
        run: |
          node --check sw.js
          node --check common.js
          for f in games/*.js lib/*.js; do node --check "$f"; done
      - name: Lint
        run: npx eslint .
      - name: Tests
        run: node --test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamper la version du cache avec le SHA du commit
        run: |
          sed -i "s/const VERSION = 'dev'/const VERSION = '${GITHUB_SHA::7}'/" sw.js
          grep "const VERSION" sw.js
          if grep -q "const VERSION = 'dev'" sw.js; then
            echo "Stamping raté : VERSION vaut encore 'dev'"; exit 1
          fi
      - name: Assembler le site (fichiers publics uniquement)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' \
                --exclude 'tests' --exclude 'package.json' --exclude 'package-lock.json' \
                --exclude 'README.md' --exclude 'CLAUDE.md' --exclude '.gitattributes' \
                --exclude '.claude' --exclude '.idea' --exclude 'eslint.config.mjs' \
                --exclude '_site' ./ _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
