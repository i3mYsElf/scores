name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérification syntaxe
        run: |
          node --check sw.js
          node --check common.js
          for f in games/*.js; do node --check "$f"; done
      - name: Tests
        run: node --test
