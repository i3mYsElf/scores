<script src="games/registry.js"></script>
<script>
const {GAMES, gameKey, HISTORY_KEY} = GameRegistry;

/* Sous-titres des cartes : partie en cours si des scores ont été saisis,
   sinon le descriptif du jeu (le registre est la source des deux). */
function renderPreviews(){
  for(const g of GAMES){
    const el = document.querySelector(`[data-sub="${g.slug}"]`);
    el.textContent = g.subtitle;
    try{
      const s = JSON.parse(localStorage.getItem(gameKey(g.slug)));
      if(s && s.started && Array.isArray(s.players) && Array.isArray(s.totals) && s.totals.some(t=>t>0)){
        el.textContent = 'Partie en cours · ' + s.players.map((p,i)=>(p.nom||'?')+' '+(s.totals[i]||0)).join(' · ');
      }
    }catch(e){}
  }
  try{
    const h = JSON.parse(localStorage.getItem(HISTORY_KEY));
    if(Array.isArray(h) && h.length){
      document.getElementById('historySub').textContent =
        h.length + (h.length > 1 ? ' parties terminées' : ' partie terminée');
    }
  }catch(e){}
}
renderPreviews();

/* ---------- export / import des sauvegardes ---------- */
const backupKeys = () => [...GAMES.map(g=>gameKey(g.slug)), HISTORY_KEY];

function buildBackup(){
  const data = {};
  for(const k of backupKeys()){
    const v = localStorage.getItem(k);
    if(v !== null){ try{ data[k] = JSON.parse(v); }catch(e){} }
  }
  return {app:'scores', version:1, date:new Date().toISOString(), data};
}

/* N'écrit que les clés connues (jeux du registre + historique), jamais de clé arbitraire. */
function applyBackup(o){
  if(!o || o.app !== 'scores' || typeof o.data !== 'object' || !o.data) throw new Error('format inattendu');
  const allowed = new Set(backupKeys());
  let n = 0;
  for(const [k,v] of Object.entries(o.data)){
    if(allowed.has(k)){ localStorage.setItem(k, JSON.stringify(v)); n++; }
  }
  renderPreviews();
  return n;
}

document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const json = JSON.stringify(buildBackup(), null, 1);
  const name = 'scores-sauvegarde-' + new Date().toISOString().slice(0,10) + '.json';
  const file = new File([json], name, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }
    catch(e){ if(e.name === 'AbortError') return; } // annulé — sinon on retombe sur le téléchargement
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e=>{
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  try{
    const o = JSON.parse(await f.text());
    if(!confirm('Importer cette sauvegarde ? Les parties en cours des jeux concernés seront remplacées.')) return;
    alert(applyBackup(o) + ' sauvegarde(s) restaurée(s).');
  }catch(err){
    alert('Fichier de sauvegarde illisible.');
  }
});

if ('serviceWorker' in navigator){
  addEventListener('load', ()=>navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(()=>{}));
}
</script>
