<link rel="stylesheet" href="common.css">
<style>
  /* styles propres à l'accueil */
  .game{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 14px;margin:12px 0;text-decoration:none;color:var(--text);
  }
  .game:active{background:var(--card-2)}
  .game .thumb{flex:0 0 40px;display:grid;place-items:center}
  .game .meta{flex:1;min-width:0}
  .game .meta b{font-family:"Fraunces",serif;font-size:19px;font-weight:600;display:block}
  .game .meta small{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
  .game .chev{color:var(--muted);font-size:20px}
  @media (prefers-reduced-motion:no-preference){
    .game{animation:rise .3s ease both}
  }
</style>

<div class="wrap">
  <header>
    <h1 class="title">Scores</h1>
    <p class="subtitle">Feuilles de score de jeux de société</p>
  </header>

  <a class="game" href="harmonies.html">

    </span>
    <span class="meta">

    </span>
    <span class="chev">›</span>
  </a>

  <a class="game" href="7wonders.html">

<script>
/* Aperçu de la partie en cours, si des scores ont été saisis */
for(const [key, id] of [['harmonies-score-v1','harmoniesSub'], ['7wonders-score-v1','wondersSub'], ['wonderfulworld-score-v1','wonderfulSub'], ['agricola-score-v1','agricolaSub'], ['cascadia-score-v1','cascadiaSub']]){
  try{
    const s = JSON.parse(localStorage.getItem(key));
    if(s && Array.isArray(s.players) && Array.isArray(s.totals) && s.totals.some(t=>t>0)){
      document.getElementById(id).textContent =
        'Partie en cours · ' + s.players.map((p,i)=>(p.nom||'?')+' '+(s.totals[i]||0)).join(' · ');
    }
  }catch(e){}
}

if ('serviceWorker' in navigator){
  addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
