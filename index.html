<style>

  .game{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 14px;margin:12px 0;text-decoration:none;color:var(--text);
  }
  .game:active{border-color:var(--muted)}
  .game .thumb{flex:0 0 40px;display:grid;place-items:center}
  .game .meta{flex:1;min-width:0}
  .game .meta b{font-family:"Anton",sans-serif;font-size:17px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;display:block}
  .game .meta small{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
  .game .chev{color:var(--muted);font-size:20px}
  @media (prefers-reduced-motion:no-preference){
    .game{animation:rise .3s ease both}
  }
  header{position:relative}
  .tool{
    position:absolute;right:0;bottom:12px;
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);display:grid;place-items:center;text-decoration:none;
  }
  .tool:active{border-color:var(--muted)}
</style>

<script src="lib/registry.js"></script>
<script src="lib/backup.js"></script>
<script>
const {GAMES, gameKey} = GameRegistry;

/* Sous-titres des cartes : partie en cours si des scores ont été saisis,
   sinon le descriptif du jeu (libellés calculés par lib/backup.js). */
function renderPreviews(){
  const parse = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
  const wrap = document.querySelector('.wrap');
  /* Menu ordonné par usage : dernier jeu utilisé en premier (ts écrit par
     common.js à chaque sauvegarde), jeux jamais ouverts ensuite dans l'ordre
     du registre (tri stable). */
  GAMES
    .map(g => {
      const s = parse(gameKey(g.slug));
      const el = document.querySelector(`[data-sub="${g.slug}"]`);
      el.textContent = GameBackup.previewLabel(s) || g.subtitle;
      return {card: el.closest('.game'), ts: (s && +s.ts) || 0};
    })
    .sort((a,b) => b.ts - a.ts)
    .forEach(({card}) => wrap.appendChild(card));
}
renderPreviews();

if ('serviceWorker' in navigator){
  addEventListener('load', ()=>navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(()=>{}));
}
// demande au navigateur de ne pas évincer le stockage (parties en cours, historique)
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
