<style>
  /* styles propres à l'accueil */
  .game{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 14px;margin:12px 0;text-decoration:none;color:var(--text);
  }
  .game:active{border-color:var(--muted)}
  .game .thumb{flex:0 0 40px;display:grid;place-items:center}
  .game .meta{flex:1;min-width:0}
  .game .meta b{font-family:"Anton",sans-serif;font-size:17px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;display:block}
  .game .meta small{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
  .game .chev{color:var(--muted);font-size:20px}
  @media (prefers-reduced-motion:no-preference){
    .game{animation:rise .3s ease both}
  }
  header{position:relative}
  .tool{
    position:absolute;right:0;bottom:12px;
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);display:grid;place-items:center;text-decoration:none;
  }
  .tool:active{border-color:var(--muted)}
  .tool.theme{right:54px}
</style>

<script src="lib/registry.js"></script>
<script src="lib/backup.js"></script>
<script>
const {GAMES, gameKey, gamePage} = GameRegistry;

/* Cartes du menu générées depuis le registre — la vignette SVG de chaque jeu
   vit dans une <template data-thumb="slug"> ci-dessus. Ordre par usage :
   dernier jeu utilisé en premier (ts écrit par common.js à chaque sauvegarde),
   jeux jamais ouverts ensuite dans l'ordre du registre (tri stable).
   Sous-titre : partie en cours si des scores ont été saisis, sinon le
   descriptif du jeu (libellés calculés par lib/backup.js).
   Idempotent : re-rendu quand un autre onglet modifie une sauvegarde. */
function renderPreviews(){
  const parse = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
  const wrap = document.querySelector('.wrap');
  wrap.querySelectorAll('a.game').forEach(el => el.remove());
  GAMES
    .map(g => {
      const s = parse(gameKey(g.slug));
      const card = document.createElement('a');
      card.className = 'game';
      card.href = gamePage(g.slug);
      card.innerHTML = '<span class="thumb"></span><span class="meta"><b></b><small></small></span><span class="chev">›</span>';
      const tpl = document.querySelector(`template[data-thumb="${g.slug}"]`);
      if(tpl) card.querySelector('.thumb').appendChild(tpl.content.cloneNode(true));
      card.querySelector('b').textContent = g.name;
      const small = card.querySelector('small');
      small.dataset.sub = g.slug;
      small.textContent = GameBackup.previewLabel(s) || g.subtitle;
      return {card, ts: (s && +s.ts) || 0};
    })
    .sort((a,b) => b.ts - a.ts)
    .forEach(({card}) => wrap.appendChild(card));
}
renderPreviews();
// un autre onglet a joué (l'événement storage ne vient jamais de cet onglet) : rafraîchir
window.addEventListener('storage', renderPreviews);

/* Invite d'installation (Chrome/Android) : on retient l'événement et on montre
   un bouton discret en bas du menu — jamais de prompt spontané. */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installEvt = e;
  document.getElementById('installBtn').hidden = false;
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice.catch(()=>{});
  installEvt = null;
  document.getElementById('installBtn').hidden = true;
});

/* Bascule de thème (theme.js) : automatique -> sombre -> clair -> automatique */
const themeBtn = document.getElementById('themeBtn');
const THEME_LABELS = {auto: 'automatique (système)', dark: 'sombre', light: 'clair'};
function syncThemeBtn(){
  const t = Theme.get() || 'auto';
  themeBtn.querySelectorAll('[data-mode]').forEach(el => { el.hidden = el.dataset.mode !== t; });
  const label = 'Thème : ' + THEME_LABELS[t];
  themeBtn.title = label;
  themeBtn.setAttribute('aria-label', label);
}
themeBtn.addEventListener('click', ()=>{
  Theme.set({auto: 'dark', dark: 'light', light: null}[Theme.get() || 'auto']);
  syncThemeBtn();
});
window.addEventListener('storage', e => { if(e.key === Theme.KEY) syncThemeBtn(); });
syncThemeBtn();

/* Indicateur hors-ligne dans le header */
function syncNet(){ document.getElementById('netState').hidden = navigator.onLine !== false; }
window.addEventListener('online', syncNet);
window.addEventListener('offline', syncNet);
syncNet();
// enregistrement du SW, bannière de mise à jour et storage.persist : sw-client.js
</script>
