<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdomino — feuille de score</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin>
<link rel="stylesheet" href="common.css">
<script src="sw-client.js" defer></script>

<div class="wrap">
  <header>
    <a class="back" href="./">← Jeux</a>
    <h1 class="title">Kingdomino</h1>
    <p class="subtitle">Feuille de score — fin de partie</p>
    <div class="tabs" id="tabs" role="tablist"></div>
  </header>

  <div id="sheetBody"></div>
</div>

<script src="lib/registry.js"></script>
<script src="lib/domino.js"></script>
<script src="games/kingdomino.js"></script>
<script src="common.js"></script>
<script>
const {blank, score} = GameLogic;
// tout ce qui touche aux domaines (rendu, interactions, départage) est partagé
// avec Queendomino dans lib/domino.js
const {fixupDomaines, domsRankExtra, domsTiebreak, domsDraw, domsRefresh, domsClick, domsInput} = GameDomino;

initSheet({
  key: 'kingdomino-score-v1',
  startPlayers: 2,
  maxPlayers: () => 4,
  blank, score,
  fixup: fixupDomaines,
  sums: s => ({domaines:s.domaines, bonus:s.bonus}),
  rankParts: s => [['Domaines',s.domaines],['Bonus',s.bonus]],
  rankExtra: domsRankExtra,
  tiebreak: domsTiebreak,

  drawSheet(d){
    return `
  <div class="card">
    <h2>${sq('var(--jaune)')}Domaines <span class="sum" data-sum="domaines">0</span></h2>
    <p class="hint">Un domaine = des cases du même terrain connectées entre elles (les diagonales ne comptent pas). Une ligne par domaine : ses cases × ses couronnes, l'app fait la multiplication. Sans couronne, un domaine vaut 0. En cas d'égalité au score, le plus grand domaine l'emporte.</p>
    <div id="domList"></div>
    <button class="ghost" id="addDom">+ Ajouter un domaine</button>
  </div>

  <div class="card">
    <h2>${sq('var(--vert)')}Bonus des variantes <span class="sum" data-sum="bonus">0</span></h2>
    <p class="hint">Harmonie : royaume complet, aucun domino défaussé. Empire du Milieu : château au centre du royaume. Ignorez si vous jouez sans.</p>
    <div class="seg">
      <button data-bonus="harmonie" aria-pressed="${d.harmonie}">Harmonie +5</button>
      <button data-bonus="milieu" aria-pressed="${d.milieu}">Empire du Milieu +10</button>
    </div>
  </div>`;
  },
  afterDraw: domsDraw,
  afterRefresh: domsRefresh,

  onClick(e, ctx){
    if(domsClick(e, ctx)) return true;
    const d = ctx.d;
    const bonus = e.target.closest('[data-bonus]');
    if(bonus){
      const k = bonus.dataset.bonus;
      d[k] = !d[k];
      bonus.setAttribute('aria-pressed', d[k]);
      ctx.refresh(); return true;
    }
    return false;
  },
  onInput: domsInput
});
</script>
