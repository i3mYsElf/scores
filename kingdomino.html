<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdomino — feuille de score</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">

<div class="wrap">
  <header>
    <a class="back" href="./">← Jeux</a>
    <h1 class="title">Kingdomino</h1>
    <p class="subtitle">Feuille de score — fin de partie</p>
    <div class="tabs" id="tabs" role="tablist"></div>
  </header>

  <div id="sheetBody"></div>
</div>

<script src="lib/registry.js"></script>
<script src="games/kingdomino.js"></script>
<script src="common.js"></script>
<script>
const {blank, score, maxDomaine} = GameLogic;

function drawDoms(d){
  document.getElementById('domList').innerHTML = d.domaines.map((m,i)=>`
    <div class="row">
      <input class="num" data-dc="${i}" type="number" min="0" inputmode="numeric" value="${m.c}" style="width:58px" aria-label="cases du domaine">
      <span style="color:var(--muted);font-size:13px">cases ×</span>
      <input class="num" data-dk="${i}" type="number" min="0" inputmode="numeric" value="${m.k}" style="width:58px" aria-label="couronnes du domaine">
      <span class="val" data-dtot="${i}" style="flex:1;text-align:right;font-weight:700;font-variant-numeric:tabular-nums">0</span>
      <button class="kill" data-deldom="${i}" aria-label="Supprimer ce domaine">×</button>
    </div>`).join('');
}

initSheet({
  key: 'kingdomino-score-v1',
  startPlayers: 2,
  maxPlayers: () => 4,
  blank, score,
  fixup: d => { if(!Array.isArray(d.domaines) || !d.domaines.length) d.domaines = [{c:0,k:0}]; },
  sums: s => ({domaines:s.domaines, bonus:s.bonus}),
  rankParts: s => [['Domaines',s.domaines],['Bonus',s.bonus]],
  rankExtra: d => { const m = maxDomaine(d); return m ? ` · plus grand domaine ${m} cases` : ''; },
  tiebreak: (a,b) => maxDomaine(b.d) - maxDomaine(a.d),

  drawSheet(d){
    return `
  <div class="card">
    <h2>${sq('var(--jaune)')}Domaines <span class="sum" data-sum="domaines">0</span></h2>
    <p class="hint">Un domaine = des cases du même terrain connectées entre elles (les diagonales ne comptent pas). Une ligne par domaine : ses cases × ses couronnes, l'app fait la multiplication. Sans couronne, un domaine vaut 0. En cas d'égalité au score, le plus grand domaine l'emporte.</p>
    <div id="domList"></div>
    <button class="ghost" id="addDom">+ Ajouter un domaine</button>
  </div>

  <div class="card">
    <h2>${sq('var(--vert)')}Bonus des variantes <span class="sum" data-sum="bonus">0</span></h2>
    <p class="hint">Harmonie : royaume complet, aucun domino défaussé. Empire du Milieu : château au centre du royaume. Ignorez si vous jouez sans.</p>
    <div class="seg">
      <button data-bonus="harmonie" aria-pressed="${d.harmonie}">Harmonie +5</button>
      <button data-bonus="milieu" aria-pressed="${d.milieu}">Empire du Milieu +10</button>
    </div>
  </div>`;
  },
  afterDraw(d){ drawDoms(d); },
  afterRefresh(d){
    document.querySelectorAll('[data-dtot]').forEach(el=>{
      const m = d.domaines[+el.dataset.dtot];
      el.textContent = m ? (+m.c||0)*(+m.k||0) : 0;
    });
  },

  onClick(e, ctx){
    const d = ctx.d;
    if(e.target.id === 'addDom'){ d.domaines.push({c:0,k:0}); drawDoms(d); ctx.refresh(); return true; }
    const del = e.target.closest('[data-deldom]');
    if(del){
      d.domaines.splice(+del.dataset.deldom,1);
      if(!d.domaines.length) d.domaines.push({c:0,k:0});
      drawDoms(d); ctx.refresh(); return true;
    }
    const bonus = e.target.closest('[data-bonus]');
    if(bonus){
      const k = bonus.dataset.bonus;
      d[k] = !d[k];
      bonus.setAttribute('aria-pressed', d[k]);
      ctx.refresh(); return true;
    }
    return false;
  },
  onInput(e, ctx){
    const d = ctx.d;
    if(e.target.dataset.dc !== undefined){ d.domaines[+e.target.dataset.dc].c = Math.max(0, +e.target.value||0); ctx.refresh(); return true; }
    if(e.target.dataset.dk !== undefined){ d.domaines[+e.target.dataset.dk].k = Math.max(0, +e.target.value||0); ctx.refresh(); return true; }
    return false;
  }
});
</script>
