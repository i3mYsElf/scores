<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agricola — feuille de score</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin>
<link rel="stylesheet" href="common.css">
<script src="sw-client.js" defer></script>

<div class="wrap">
  <header>
    <a class="back" href="./">← Jeux</a>
    <h1 class="title">Agricola</h1>
    <p class="subtitle">Feuille de score — fin de partie</p>
    <div class="tabs" id="tabs" role="tablist"></div>
  </header>

  <div id="sheetBody"></div>
</div>

<script src="lib/registry.js"></script>
<script src="games/agricola.js"></script>
<script src="common.js"></script>
<script>
const {blank, score} = GameLogic;

initSheet({
  key: 'agricola-score-v1',
  startPlayers: 2,
  maxPlayers: () => 5,
  blank, score,
  sums: s => ({cultures:s.cultures, elevage:s.elevage, ferme:s.ferme, cartes:s.cartes+s.mendicite}),
  rankParts: s => [
    ['Cultures',s.cultures],['Élevage',s.elevage],['Ferme',s.ferme],
    ['Cartes',s.cartes],['Mendicité',s.mendicite]
  ],

  drawSheet(d){
    return `
  <div class="card">
    <h2>${sq('var(--jaune)')}Cultures <span class="sum" data-sum="cultures">0</span></h2>
    <p class="hint">Comptez, l'app applique le barème. Céréales et légumes : en réserve <b>et</b> sur les champs.</p>
    ${rowStep('champs','Champs','−1 · 1 · 2 · 3 · 4 pts pour 0-1 · 2 · 3 · 4 · 5+')}
    ${rowStep('cereales','Céréales','−1 · 1 · 2 · 3 · 4 pts pour 0 · 1 · 4 · 6 · 8+')}
    ${rowStep('legumes','Légumes','−1 · 1 · 2 · 3 · 4 pts pour 0 · 1 · 2 · 3 · 4+')}
  </div>

  <div class="card">
    <h2>${sq('var(--vert)')}Élevage <span class="sum" data-sum="elevage">0</span></h2>
    ${rowStep('paturages','Pâturages','−1 · 1 · 2 · 3 · 4 pts pour 0 · 1 · 2 · 3 · 4+')}
    ${rowStep('moutons','Moutons','−1 · 1 · 2 · 3 · 4 pts pour 0 · 1 · 4 · 6 · 8+')}
    ${rowStep('sangliers','Sangliers','−1 · 1 · 2 · 3 · 4 pts pour 0 · 1 · 3 · 5 · 7+')}
    ${rowStep('boeufs','Bœufs','−1 · 1 · 2 · 3 · 4 pts pour 0 · 1 · 2 · 4 · 6+')}
    ${rowStep('etables','Étables clôturées','+1 point chacune')}
  </div>

  <div class="card">
    <h2>${sq('var(--marron)')}Ferme &amp; famille <span class="sum" data-sum="ferme">0</span></h2>
    <p class="hint">Une case est « utilisée » si elle est clôturée ou porte une pièce, un champ ou une étable.</p>
    ${rowStep('vides','Cases inutilisées','−1 point chacune')}
    ${rowStep('argile','Pièces en argile','+1 point chacune (bois : 0)')}
    ${rowStep('pierre','Pièces en pierre','+2 points chacune')}
    ${rowStep('personnes','Membres de la famille','+3 points chacun')}
  </div>

  <div class="card">
    <h2>${sq('var(--bleu)')}Cartes <span class="sum" data-sum="cartes">0</span></h2>
    <p class="hint">Points imprimés sur vos aménagements et savoir-faire, plus les points bonus gagnés en cours de partie.</p>
    <div class="row">
      <div class="lab">Points des cartes</div>
      <input class="num" data-num="cartes" type="number" min="0" inputmode="numeric" value="${d.cartes}">
    </div>
    <div class="row">
      <div class="lab">Points bonus</div>
      <input class="num" data-num="bonus" type="number" min="0" inputmode="numeric" value="${d.bonus}">
    </div>
    ${rowStep('mendicite','Cartes mendicité','−3 points chacune')}
  </div>`;
  }
});
</script>
