<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harmonies — feuille de score</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#131E1C">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">

<div class="wrap">
  <header>
    <a class="back" href="./">← Jeux</a>
    <h1 class="title">Harmonies</h1>
    <p class="subtitle">Feuille de score — fin de partie</p>
    <div class="tabs" id="tabs" role="tablist"></div>
  </header>

  <div id="sheetBody"></div>
</div>

<script src="games/harmonies.js"></script>
<script src="common.js"></script>
<script>
const {blank, score} = GameLogic;

const TOK = {
  marron:['#9A6B45','#7A5133'], vert:['#6E9C55','#4F7439'], gris:['#93A0A8','#6E7B83'],
  jaune:['#DFB149','#B78B2E'], bleu:['#4A90C0','#35709B'], rouge:['#C4604F','#9A4737']
};

/* Pile de jetons vue de côté, comme sur le plateau */
function stack(colors){
  const n = colors.length, base = 30, h = 8;
  let s = `<svg viewBox="0 0 34 36" width="34" height="36" aria-hidden="true">`;
  for(let i=0;i<n;i++){
    const [lt,dk] = TOK[colors[i]], y = base - i*h;
    s += `<path d="M2,${y} L2,${y+h} A15,5 0 0 0 32,${y+h} L32,${y} Z" fill="${dk}"/>`;
    s += `<ellipse cx="17" cy="${y}" rx="15" ry="5" fill="${lt}"/>`;
  }
  return s + `</svg>`;
}
const rowT = (path, colors, lab, sub) => rowStep(path, lab, sub, stack(colors));

function drawEau(d){
  document.getElementById('eauBody').innerHTML = d.face === 'A'
    ? `<p class="hint">Seule la plus longue rivière compte : suivez-la d'un bout à l'autre par le chemin le plus court. Barème : 0 · 2 · 5 · 8 · 11 · 15, puis +4 par jeton au-delà de 6.</p>
       ${rowT('riviere',['bleu'],'Longueur de la rivière','en jetons bleus')}`
    : `<p class="hint">Chaque zone isolée par vos jetons bleus est une île, 5 points pièce. Vous avez toujours au moins 1 île.</p>
       ${rowT('iles',['bleu'],'Nombre d\'îles','5 points chacune')}`;
}

function drawAnim(d){
  document.getElementById('animList').innerHTML = d.animaux.map((v,i)=>`
    <div class="row">
      <div class="lab">Carte ${i+1}</div>
      <input class="num" data-anim="${i}" type="number" inputmode="numeric" min="0" value="${v}">
      <button class="kill" data-delanim="${i}" aria-label="Supprimer la carte ${i+1}">×</button>
    </div>`).join('');
}

initSheet({
  key: 'harmonies-score-v1',
  startPlayers: 2,
  maxPlayers: () => 4,
  blank, score,
  stepMin: p => p === 'iles' ? 1 : 0,
  sums: s => ({arbre:s.arbre, mont:s.mont, cb:s.champs+s.batiments, eau:s.eau, animaux:s.animaux+s.esprit}),
  rankParts: s => [
    ['Arbres',s.arbre],['Montagnes',s.mont],['Champs',s.champs],
    ['Bâtiments',s.batiments],['Eau',s.eau],['Animaux',s.animaux+s.esprit]
  ],

  drawSheet(d){
    return `
  <div class="card">
    <h2>Arbres <span class="sum" data-sum="arbre">0</span></h2>
    <p class="hint">1 jeton vert posé sur 0, 1 ou 2 jetons marron.</p>
    ${rowT('arbre.0',['vert'],'Arbre de 1 jeton','1 point')}
    ${rowT('arbre.1',['marron','vert'],'Arbre de 2 jetons','3 points')}
    ${rowT('arbre.2',['marron','marron','vert'],'Arbre de 3 jetons','7 points')}
  </div>

  <div class="card">
    <h2>Montagnes <span class="sum" data-sum="mont">0</span></h2>
    <p class="hint">Ne comptez que les montagnes adjacentes à au moins une autre montagne. Une montagne isolée ne rapporte rien.</p>
    ${rowT('mont.0',['gris'],'Pile de 1 jeton','1 point')}
    ${rowT('mont.1',['gris','gris'],'Pile de 2 jetons','3 points')}
    ${rowT('mont.2',['gris','gris','gris'],'Pile de 3 jetons','7 points')}
  </div>

  <div class="card">
    <h2>Champs &amp; bâtiments <span class="sum" data-sum="cb">0</span></h2>
    <p class="hint">Un champ = au moins 2 jetons jaunes connectés (un groupe de 4 jetons reste un seul champ). Un bâtiment compte s'il est entouré d'au moins 3 couleurs différentes.</p>
    ${rowT('champs',['jaune'],'Champs','5 points chacun')}
    ${rowT('batiments',['gris','rouge'],'Bâtiments validés','5 points chacun')}
  </div>

  <div class="card">
    <h2>Eau <span class="sum" data-sum="eau">0</span></h2>
    <div class="seg">
      <button data-face="A" aria-pressed="${d.face==='A'}">Face A · Rivière</button>
      <button data-face="B" aria-pressed="${d.face==='B'}">Face B · Îles</button>
    </div>
    <div id="eauBody"></div>
  </div>

  <div class="card">
    <h2>Cartes animaux <span class="sum" data-sum="animaux">0</span></h2>
    <p class="hint">Saisissez les points inscrits sur chaque carte, selon le nombre de cubes que vous avez posés.</p>
    <div id="animList"></div>
    <button class="ghost" id="addAnim">+ Ajouter une carte</button>
    <div class="row">
      <div class="lab">Esprit de la nature<small>Laissez à 0 si vous n'y jouez pas</small></div>
      <input class="num" data-num="esprit" type="number" inputmode="numeric" min="0" value="${d.esprit}">
    </div>
  </div>`;
  },
  afterDraw(d){ drawEau(d); drawAnim(d); },

  onClick(e, ctx){
    const d = ctx.d;
    const face = e.target.closest('[data-face]');
    if(face){
      d.face = face.dataset.face;
      document.querySelectorAll('[data-face]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.face===d.face));
      drawEau(d); ctx.refresh(); return true;
    }
    if(e.target.id === 'addAnim'){ d.animaux.push(0); drawAnim(d); ctx.refresh(); return true; }
    const del = e.target.closest('[data-delanim]');
    if(del){
      d.animaux.splice(+del.dataset.delanim,1);
      if(!d.animaux.length) d.animaux.push(0);
      drawAnim(d); ctx.refresh(); return true;
    }
    return false;
  },
  onInput(e, ctx){
    if(e.target.dataset.anim !== undefined){
      ctx.d.animaux[+e.target.dataset.anim] = Math.max(0, +e.target.value||0);
      ctx.refresh(); return true;
    }
    return false;
  }
});
</script>
