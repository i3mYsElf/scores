<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sea Salt & Paper — feuille de score</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin>
<link rel="stylesheet" href="common.css">
<script src="theme.js"></script>
<script src="sw-client.js" defer></script>

<div class="wrap">
  <header>
    <a class="back" href="./">← Jeux</a>
    <h1 class="title">Sea Salt &amp; Paper</h1>
    <p class="subtitle">Feuille de score — manches cumulées</p>
    <div class="tabs" id="tabs"></div>
  </header>

  <div id="sheetBody"></div>
</div>

<script src="lib/registry.js"></script>
<script src="lib/html.js"></script>
<script src="lib/sheet.js"></script>
<script src="lib/manches.js"></script>
<script src="games/seasaltpaper.js"></script>
<script src="common.js"></script>
<script>
const {blank, score, objectif, fixup, validerManche, maxPlayers, MAX_CARTES, MAX_SIRENES} = GameLogic;
// la liste des manches validées et le bandeau de fin de partie sont partagés
// avec Skyjo dans lib/manches.js (ici manches positives seulement)
const {manchesRankExtra, manchesFin} = GameManches;
const {manchesDraw, manchesClick, manchesInput} = GameManches.manchesFor(false);

const MULTIS = [
  ['phare', 'Phare'], ['banc', 'Banc de poissons'],
  ['colonie', 'Colonie'], ['capitaine', 'Capitaine']
];

function drawSirenes(d){
  document.getElementById('sireneList').innerHTML = d.sirenes.map((s,i)=>`
    <div class="row">
      <div class="lab">Sirène ${i+1}<small>cartes de sa couleur majoritaire</small></div>
      <input class="num num-m" data-sir="${i}" type="number" min="0" inputmode="numeric" value="${+s||0}" aria-label="cartes de la couleur de la sirène ${i+1}">
      <button class="kill" data-delsir="${i}" aria-label="Retirer la sirène ${i+1}">×</button>
    </div>`).join('')
    + (d.sirenes.length >= MAX_SIRENES
      ? `<p class="hint" style="color:var(--accent);font-weight:600">${MAX_SIRENES} sirènes : victoire immédiate !</p>`
      : '<button class="ghost" id="addSir">+ Ajouter une sirène</button>');
}

initSheet({
  slug: 'seasaltpaper',
  startPlayers: 2,
  maxPlayers,
  blank, score, fixup,
  sums: s => ({prec: s.precedentes, duos: s.duos, collections: s.collections,
               mult: s.mult, sirenes: s.sirenes, manche: s.manche}),
  rankParts: s => [
    ['Manches précédentes', s.precedentes], ['Manche en cours', s.manche]
  ],
  rankExtra: (d, ctx) => manchesRankExtra(d)
    + (score(d).precedentes >= objectif(ctx.players.length)
    ? ' · objectif atteint' : ''),
  // départage officiel : le plus de points à la dernière manche (celle en cours)
  tiebreak: (a,b) => b.s.manche - a.s.manche,

  drawSheet(d, ctx){
    const nb = ctx.players.length, obj = objectif(nb);
    return `
  <div class="card">
    <h2>${sq('var(--gris)')}Manches précédentes <span class="sum" data-sum="prec">0</span></h2>
    <p class="hint">Objectif à ${nb} joueurs : <b>${obj} points</b> (2 j : 40 · 3 j : 35 · 4 j : 30). Comptez la manche en cours ci-dessous, puis « Valider la manche » pour l'ajouter au cumul.</p>
    <div id="mancheList"></div>
    <p class="hint" id="objAtteint" hidden style="color:var(--accent);font-weight:600"></p>
  </div>

  <div class="card">
    <h2>${sq('var(--bleu)')}Duos <span class="sum" data-sum="duos">0</span></h2>
    <p class="hint">Comptez vos cartes (en main et posées) : 1 point par paire, l'app fait les paires. Nageur + requin : 1 point la combinaison.</p>
    ${rowStep('crabes','Crabes')}
    ${rowStep('bateaux','Bateaux')}
    ${rowStep('poissons','Poissons')}
    ${rowStep('nageurs','Nageurs')}
    ${rowStep('requins','Requins')}
  </div>

  <div class="card">
    <h2>${sq('var(--jaune)')}Collections <span class="sum" data-sum="collections">0</span></h2>
    <p class="hint">Les paliers sont calculés d'après le nombre de cartes.</p>
    ${rowStep('coquillages','Coquillages','0, 2, 4, 6, 8, 10 pts')}
    ${rowStep('poulpes','Poulpes','0, 3, 6, 9, 12 pts')}
    ${rowStep('pingouins','Pingouins','1, 3, 5 pts')}
    ${rowStep('marins','Marins','0 puis 5 pts')}
  </div>

  <div class="card">
    <h2>${sq('var(--rouge)')}Multiplicateurs <span class="sum" data-sum="mult">0</span></h2>
    <p class="hint">Phare : 1 pt par bateau · Banc : 1 pt par poisson · Colonie : 2 pts par pingouin · Capitaine : 3 pts par marin. La carte ne compte pas comme carte du type multiplié.</p>
    <div class="seg">
      ${MULTIS.map(([k,lab])=>`<button data-multi="${k}" aria-pressed="${!!d[k]}">${lab}</button>`).join('')}
    </div>
  </div>

  <div class="card">
    <h2>${sq('var(--vert)')}Sirènes <span class="sum" data-sum="sirenes">0</span></h2>
    <p class="hint">Chaque sirène rapporte 1 point par carte de votre couleur la plus représentée — une couleur différente par sirène.</p>
    <div id="sireneList"></div>
  </div>

  <div class="card">
    <h2>${sq('var(--marron)')}Fin de manche <span class="sum" data-sum="manche">0</span></h2>
    <p class="hint">Stop : chacun marque ses points. Dernière chance gagnée : vos points + le bonus couleur (les autres marquent leur seul bonus). Perdue : votre seul bonus couleur.</p>
    <div class="seg">
      <button data-fin="stop" aria-pressed="${d.fin==='stop'}">Stop</button>
      <button data-fin="gagne" aria-pressed="${d.fin==='gagne'}">Dern. chance ✓</button>
      <button data-fin="perdu" aria-pressed="${d.fin==='perdu'}">Dern. chance ✗</button>
    </div>
    ${d.fin==='stop' ? '' : rowStep('bonus','Bonus couleur','cartes de votre couleur majoritaire')}
    <button class="ghost" id="valManche">Valider la manche</button>
  </div>`;
  },
  afterDraw(d){ manchesDraw(d); drawSirenes(d); },

  /* Bandeau de fin de partie : seul le cumul des manches validées compte,
     la manche en cours ne déclenche rien tant qu'elle n'est pas validée. */
  afterRefresh(d, s, ctx){
    const obj = objectif(ctx.players.length);
    manchesFin('objAtteint', ctx.players,
      p => score(p.d).precedentes >= obj,
      noms => `Objectif de ${obj} points atteint par ${noms.join(', ')} — la partie se termine !`);
  },

  /* plafonne les steppers au nombre de cartes du paquet (appui long compris) */
  stepMax: p => MAX_CARTES[p],

  onClick(e, ctx){
    if(manchesClick(e, ctx)) return true;
    const d = ctx.d;
    const multi = e.target.closest('[data-multi]');
    if(multi){ const k = multi.dataset.multi; d[k] = d[k] ? 0 : 1; ctx.redraw(); return true; }
    const fin = e.target.closest('[data-fin]');
    if(fin){ d.fin = fin.dataset.fin; ctx.redraw(); return true; }
    if(e.target.id === 'addSir'){
      if(d.sirenes.length < MAX_SIRENES){ d.sirenes.push(0); drawSirenes(d); ctx.refresh(); }
      return true;
    }
    const delSir = e.target.closest('[data-delsir]');
    if(delSir){ d.sirenes.splice(+delSir.dataset.delsir, 1); drawSirenes(d); ctx.refresh(); return true; }
    if(e.target.id === 'valManche'){
      validerManche(d);
      ctx.redraw(); return true;
    }
    return false;
  },
  onInput(e, ctx){
    if(manchesInput(e, ctx)) return true;
    const d = ctx.d;
    if(e.target.dataset.sir !== undefined){
      d.sirenes[+e.target.dataset.sir] = Math.max(0, +e.target.value || 0);
      ctx.refresh(); return true;
    }
    return false;
  }
});
</script>
