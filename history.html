<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Historique — parties terminées</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin>
<link rel="stylesheet" href="common.css">
<script src="theme.js"></script>
<script src="sw-client.js" defer></script>
<style>
  .backup{display:flex;gap:10px;margin:18px 0 4px}
  .backup button{
    flex:1;padding:11px;border-radius:var(--r);border:1px solid var(--line);
    background:none;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;
  }
  .backup button:active{border-color:var(--muted)}
  /* ventilation archivée : repliée par défaut, dépliée au toucher de la carte */
  #historyList .card.hasDetail{cursor:pointer}
  #historyList .card:not(.open) .rank .nm small{display:none}
  #historyList .card:not(.open) .exts{display:none}
  #historyList .exts{margin:8px 0 2px}
  /* filtres de consultation (jeu / joueur) — non persistés */
  .filters{display:flex;gap:10px;margin:0 0 14px}
  .filters select{
    flex:1;min-width:0;padding:9px;border-radius:9px;border:1px solid var(--line);
    background:var(--field);color:var(--text);font:inherit;font-size:13.5px;
  }
  /* champs du mode édition d'une partie */
  .ename{
    flex:1;min-width:0;padding:9px;border-radius:9px;border:1px solid var(--line);
    background:var(--field);color:var(--text);font:inherit;font-size:15px;
  }
</style>

<div class="wrap">
  <header>
    <a class="back" href="./">← Jeux</a>
    <h1 class="title">Historique</h1>
    <p class="subtitle" id="histSub">Parties terminées</p>
  </header>

  <div class="filters" id="filters" hidden>
    <select id="filterG" aria-label="Filtrer par jeu"></select>
    <select id="filterP" aria-label="Filtrer par joueur"></select>
  </div>

  <div id="statsCard"></div>
  <div id="historyList"></div>

  <div class="backup">
    <button id="exportBtn" type="button">Exporter les sauvegardes</button>
    <button id="importBtn" type="button">Importer</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>
  <div class="backup" style="margin-top:0">
    <button id="csvBtn" type="button" hidden>Exporter l'historique (CSV)</button>
  </div>
  <p class="hint" id="storageInfo" style="text-align:center" hidden></p>
  <button class="reset" id="clearHist" hidden>Effacer l'historique</button>
</div>

<script src="lib/registry.js"></script>
<script src="lib/backup.js"></script>
<script src="lib/stats.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const NAMES = Object.fromEntries(GameRegistry.GAMES.map(g => [g.slug, g.name]));
// jeux où le plus petit total gagne (Skyjo) : re-tri d'édition et record inversés
const LOW_WINS = GameRegistry.GAMES.filter(g => g.lowWins).map(g => g.slug);
const HISTORY_KEY = GameRegistry.HISTORY_KEY;

let editIdx = null; // index de l'entrée en cours d'édition, null sinon

function readHist(){
  try{
    const h = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    return Array.isArray(h) ? h : [];
  }catch(e){ return []; }
}
function writeHist(h){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); return true; }
  catch(e){ alert('Enregistrement impossible : stockage indisponible.'); return false; }
}

/* Ventilation d'un joueur archivé : paires [libellé, valeur] figées par
   archive() de common.js (absentes des anciennes entrées). Tout est échappé :
   un import peut mettre n'importe quoi dans l'historique. */
const detail = p => Array.isArray(p.parts) && p.parts.length
  ? `<small>${p.parts.map(x => `${esc(x[0])} ${esc(x[1])}`).join(' · ')}${p.extra ? esc(p.extra) : ''}</small>`
  : '';

const gameCard = (e, i) => {
  const exts = Array.isArray(e.exts) && e.exts.length ? e.exts : null;
  const hasDetail = !!exts || (e.players || []).some(p => p && Array.isArray(p.parts) && p.parts.length);
  return `
    <div class="card${hasDetail ? ' hasDetail' : ''}">
      <h2>${esc(NAMES[e.g] || e.g)}
        <span class="sum">${e.t ? new Date(e.t).toLocaleString('fr-FR', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : ''}</span>
        <button class="kill" data-edit="${i}" aria-label="Modifier cette partie" title="Modifier cette partie">✎</button>
        <button class="kill" data-del="${i}" aria-label="Supprimer cette partie" title="Supprimer cette partie">×</button></h2>
      ${(e.players || []).map((p, j) => {
        // position figée par archive() sur les ex æquo — plusieurs « 1 » possibles
        const pos = (p && p.pos) || j + 1;
        return `
        <div class="rank ${pos === 1 ? 'win' : ''}">
          <span class="pos">${pos}</span>
          <span class="nm">${esc((p && p.nom) || '?')}${detail(p || {})}</span>
          <span class="pt">${+((p && p.total)) || 0}</span>
        </div>`;}).join('')}
      ${exts ? `<p class="exts hint">Extensions : ${exts.map(esc).join(' · ')}</p>` : ''}
    </div>`;
};

/* Mode édition : corriger un nom mal saisi ou un total erroné. */
const editCard = (e, i) => `
    <div class="card">
      <h2>${esc(NAMES[e.g] || e.g)} <span class="sum">édition</span></h2>
      ${(e.players || []).map((p, j) => `
        <div class="rank">
          <input class="ename" data-enom="${j}" type="text" value="${esc((p && p.nom) || '')}" autocapitalize="words" aria-label="Nom du joueur">
          <input class="num" data-etot="${j}" type="number" value="${+((p && p.total)) || 0}" aria-label="Total">
        </div>`).join('')}
      <div class="backup" style="margin:10px 0 4px">
        <button type="button" data-esave="${i}">Enregistrer</button>
        <button type="button" data-ecancel>Annuler</button>
      </div>
    </div>`;

let filterG = '', filterP = ''; // filtres de consultation — volontairement non persistés

function render(){
  const h = readHist();
  // export/effacement : toujours sur l'historique complet, jamais filtré
  document.getElementById('clearHist').hidden = !h.length;
  document.getElementById('csvBtn').hidden = !h.length;

  /* Options des filtres dérivées de l'historique : jeux présents, joueurs
     regroupés sans tenir compte de la casse (affichée : la plus récente) —
     reconstruites à chaque rendu (import, autre onglet), sélection préservée. */
  const games = [...new Set(h.map(e => e && e.g).filter(g => typeof g === 'string'))];
  const pNames = new Map(); // clé minuscule → casse affichée
  for(const e of h) for(const p of ((e && e.players) || []))
    if(p && typeof p.nom === 'string' && !pNames.has(p.nom.toLocaleLowerCase('fr')))
      pNames.set(p.nom.toLocaleLowerCase('fr'), p.nom);
  if(filterG && !games.includes(filterG)) filterG = '';
  if(filterP && !pNames.has(filterP)) filterP = '';
  const selG = document.getElementById('filterG'), selP = document.getElementById('filterP');
  selG.innerHTML = '<option value="">Tous les jeux</option>'
    + games.map(g => `<option value="${esc(g)}">${esc(NAMES[g] || g)}</option>`).join('');
  selP.innerHTML = '<option value="">Tous les joueurs</option>'
    + [...pNames].map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join('');
  selG.value = filterG;
  selP.value = filterP;
  document.getElementById('filters').hidden = !h.length;

  /* Liste filtrée en gardant les index d'origine : data-del/data-edit/editIdx
     pointent toujours dans le tableau stocké, pas dans la vue. Les entrées
     restent entières (jamais de joueur retiré d'une partie). */
  const shown = h.map((e, i) => [e, i]).filter(([e]) =>
    (!filterG || (e && e.g === filterG)) &&
    (!filterP || ((e && e.players) || []).some(p =>
      p && typeof p.nom === 'string' && p.nom.toLocaleLowerCase('fr') === filterP)));
  const view = shown.map(([e]) => e);
  document.getElementById('histSub').textContent = GameBackup.historyLabel(view) || 'Parties terminées';

  /* Statistiques par joueur (lib/stats.js), sur la même vue filtrée que la
     liste : filtrer par jeu donne son palmarès, par joueur ses stats. */
  const stats = GameStats.computeStats(view, LOW_WINS);
  document.getElementById('statsCard').innerHTML = stats.length ? `
    <div class="card">
      <h2>Statistiques</h2>
      ${stats.map((s,i) => `
        <div class="rank ${i===0 ? 'win' : ''}">
          <span class="pos">${i+1}</span>
          <span class="nm">${esc(s.nom)}<small>${[
            `${s.parties} partie${s.parties>1?'s':''}`,
            s.taux === null ? '' : `${s.taux} % de victoires`,
            /* record du jeu le plus joué — les totaux ne se comparent pas entre jeux */
            s.bests.length ? `record ${s.bests[0].total} (${esc(NAMES[s.bests[0].g] || s.bests[0].g)})` : ''
          ].filter(Boolean).join(' · ')}</small></span>
          <span class="pt">${s.victoires}<small style="display:block;font-size:10px;color:var(--muted)">victoire${s.victoires>1?'s':''}</small></span>
        </div>`).join('')}
    </div>` : '';

  document.getElementById('historyList').innerHTML = shown.length
    ? shown.map(([e, i]) => i === editIdx ? editCard(e, i) : gameCard(e, i)).join('')
    : h.length
      ? '<p class="hint">Aucune partie ne correspond aux filtres.</p>'
      : '<p class="hint">Aucune partie terminée pour l\'instant. Les parties s\'archivent ici quand vous terminez une partie depuis le classement d\'une feuille.</p>';
}
render();

document.getElementById('filters').addEventListener('change', ()=>{
  filterG = document.getElementById('filterG').value;
  filterP = document.getElementById('filterP').value;
  editIdx = null; // ne pas laisser une carte en édition disparaître silencieusement
  render();
});

/* clics dans la liste : suppression, édition, repli/dépli du détail
   (les index suivent l'ordre de rendu, la liste est re-rendue après chaque action) */
document.getElementById('historyList').addEventListener('click', e=>{
  const del = e.target.closest('[data-del]');
  if(del){
    if(!confirm('Supprimer cette partie de l\'historique ?')) return;
    const h = readHist();
    h.splice(+del.dataset.del, 1);
    if(!writeHist(h)) return;
    editIdx = null; render(); return;
  }
  const ed = e.target.closest('[data-edit]');
  if(ed){ editIdx = +ed.dataset.edit; render(); return; }
  if(e.target.closest('[data-ecancel]')){ editIdx = null; render(); return; }
  const save = e.target.closest('[data-esave]');
  if(save){
    const h = readHist(), entry = h[+save.dataset.esave];
    if(entry){
      const card = save.closest('.card');
      const noms = [...card.querySelectorAll('[data-enom]')].map(el => el.value.trim());
      const tots = [...card.querySelectorAll('[data-etot]')].map(el => +el.value || 0);
      entry.players = (entry.players || [])
        .map((p, j) => ({...p, nom: noms[j] || (p && p.nom) || '?', total: tots[j]}))
        // tri stable : l'ordre existant départage les égalités
        .sort((a, b) => LOW_WINS.includes(entry.g) ? a.total - b.total : b.total - a.total);
      /* pos figé par archive() obsolète après édition manuelle : le recalculer
         par égalité de total seul (le départage du jeu n'est pas recalculable) */
      entry.players.forEach((p, j) => {
        delete p.pos;
        if(j > 0 && p.total === entry.players[j - 1].total)
          p.pos = entry.players[j - 1].pos || j;
      });
      if(!writeHist(h)) return;
    }
    editIdx = null; render(); return;
  }
  // toucher une carte replie/déplie la ventilation archivée
  const card = e.target.closest('.card.hasDetail');
  if(card) card.classList.toggle('open');
});

document.getElementById('clearHist').addEventListener('click', ()=>{
  if(!confirm("Effacer tout l'historique des parties ?")) return;
  localStorage.removeItem(HISTORY_KEY);
  editIdx = null;
  render();
});

/* ---------- export / import des sauvegardes (logique dans lib/backup.js) ---------- */
function buildBackup(){ return GameBackup.buildBackup(localStorage); }
function applyBackup(o){
  const n = GameBackup.applyBackup(localStorage, o);
  render();
  return n;
}

/* partage natif si possible, téléchargement sinon */
async function shareOrDownload(text, name, type){
  const file = new File([text], name, {type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }
    catch(e){ if(e.name === 'AbortError') return; } // annulé — sinon on retombe sur le téléchargement
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById('exportBtn').addEventListener('click', ()=>
  shareOrDownload(JSON.stringify(buildBackup(), null, 1),
    'scores-sauvegarde-' + new Date().toISOString().slice(0,10) + '.json', 'application/json'));

document.getElementById('csvBtn').addEventListener('click', ()=>
  // BOM : les accents s'ouvrent correctement dans Excel
  shareOrDownload('\uFEFF' + GameBackup.historyCsv(readHist(), NAMES),
    'scores-historique-' + new Date().toISOString().slice(0,10) + '.csv', 'text/csv'));

/* État du stockage (best effort) : persistance accordée ? occupation estimée ? */
(async ()=>{
  if(!navigator.storage) return;
  const parts = [];
  try{
    if(navigator.storage.persisted)
      parts.push((await navigator.storage.persisted())
        ? 'persistant'
        : 'non persistant — le navigateur peut l\'évincer, exportez régulièrement');
    if(navigator.storage.estimate){
      const {usage, quota} = await navigator.storage.estimate();
      if(quota) parts.push(`${(usage / 1048576).toFixed(1)} Mo utilisés sur ${Math.round(quota / 1048576)} Mo`);
    }
  }catch(e){}
  if(parts.length){
    const el = document.getElementById('storageInfo');
    el.hidden = false;
    el.textContent = 'Stockage : ' + parts.join(' · ');
  }
})();

document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e=>{
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  let o;
  try{ o = JSON.parse(await f.text()); }
  catch(err){ alert('Fichier de sauvegarde illisible.'); return; }
  if(!confirm('Importer cette sauvegarde ? Les parties en cours des jeux concernés seront remplacées.')) return;
  try{
    editIdx = null;
    alert(applyBackup(o) + ' sauvegarde(s) restaurée(s).');
  }catch(err){
    // l'import est atomique (lib/backup.js) : en cas d'échec, rien n'a changé
    alert(err && err.code === 'storage'
      ? 'Écriture impossible (stockage plein ou indisponible) — rien n\'a été modifié.'
      : 'Fichier de sauvegarde illisible.');
  }
});

// un autre onglet a archivé ou modifié des parties : re-rendre
window.addEventListener('storage', e => {
  if(e.key !== HISTORY_KEY) return;
  editIdx = null;
  render();
});

// enregistrement du SW, bannière de mise à jour et storage.persist : sw-client.js
</script>
