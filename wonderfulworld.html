<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>It's a Wonderful World — feuille de score</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin>
<link rel="stylesheet" href="common.css">
<script src="sw-client.js" defer></script>

<div class="wrap">
  <header>
    <a class="back" href="./">← Jeux</a>
    <h1 class="title">It's a Wonderful World</h1>
    <p class="subtitle">Feuille de score — fin de partie</p>
    <div class="tabs" id="tabs" role="tablist"></div>
  </header>

  <div id="sheetBody"></div>
</div>

<script src="lib/registry.js"></script>
<script src="games/wonderfulworld.js"></script>
<script src="common.js"></script>
<script>
const {blank, score} = GameLogic;

function drawMults(d){
  document.getElementById('multList').innerHTML = d.mults.map((m,i)=>`
    <div class="row">
      <input class="num" data-mv="${i}" type="number" min="0" inputmode="numeric" value="${m.v}" style="width:58px" aria-label="PV par élément">
      <span style="color:var(--muted);font-size:13px">PV ×</span>
      <input class="num" data-mn="${i}" type="number" min="0" inputmode="numeric" value="${m.n}" style="width:58px" aria-label="nombre d'éléments">
      <span class="val" data-mtot="${i}" style="flex:1;text-align:right;font-weight:700;font-variant-numeric:tabular-nums">0</span>
      <button class="kill" data-delmult="${i}" aria-label="Supprimer ce multiplicateur">×</button>
    </div>`).join('');
}

initSheet({
  key: 'wonderfulworld-score-v1',
  startPlayers: 2,
  maxPlayers: () => 5,
  blank, score,
  fixup: d => { if(!Array.isArray(d.mults) || !d.mults.length) d.mults = [{v:0,n:0}]; },
  sums: s => ({cartes:s.fixes+s.mults, persos:s.financiers+s.generaux}),
  rankParts: s => [
    ['Cartes',s.fixes],['Multiplicateurs',s.mults],
    ['Financiers',s.financiers],['Généraux',s.generaux]
  ],
  rankExtra: d => d.cartes ? ` · ${d.cartes} cartes` : '',
  tiebreak: (a,b) => b.d.cartes - a.d.cartes
                  || (b.d.financiers+b.d.generaux) - (a.d.financiers+a.d.generaux),

  drawSheet(d){
    return `
  <div class="card">
    <h2>${sq('var(--bleu)')}Points des cartes <span class="sum" data-sum="cartes">0</span></h2>
    <p class="hint">La somme des PV fixes imprimés sur vos cartes construites.</p>
    <div class="row">
      <div class="lab">Points fixes</div>
      <input class="num" data-num="fixes" type="number" min="0" inputmode="numeric" value="${d.fixes}">
    </div>
    <p class="hint" style="margin-top:8px">Une ligne par carte multiplicatrice : sa valeur en PV × le nombre d'éléments concernés (cartes d'une catégorie, jetons…). L'app fait la multiplication.</p>
    <div id="multList"></div>
    <button class="ghost" id="addMult">+ Ajouter un multiplicateur</button>
  </div>

  <div class="card">
    <h2>${sq('var(--jaune)')}Personnages <span class="sum" data-sum="persos">0</span></h2>
    <p class="hint">1 point par jeton. Les bonus « X PV par Financier/Général » de certaines cartes se saisissent en multiplicateur ci-dessus.</p>
    ${rowStep('financiers','Financiers','jetons dorés')}
    ${rowStep('generaux','Généraux','jetons rouges')}
  </div>

  <div class="card">
    <h2>${sq('var(--gris)')}Départage <span class="sum">0 pts</span></h2>
    <p class="hint">Ne rapporte aucun point : en cas d'égalité, le plus de cartes construites l'emporte, puis le plus de jetons personnages.</p>
    ${rowStep('cartes','Cartes construites','dans votre empire')}
  </div>`;
  },
  afterDraw(d){ drawMults(d); },
  afterRefresh(d){
    document.querySelectorAll('[data-mtot]').forEach(el=>{
      const m = d.mults[+el.dataset.mtot];
      el.textContent = m ? (+m.v||0)*(+m.n||0) : 0;
    });
  },

  onClick(e, ctx){
    const d = ctx.d;
    if(e.target.id === 'addMult'){ d.mults.push({v:0,n:0}); drawMults(d); ctx.refresh(); return true; }
    const del = e.target.closest('[data-delmult]');
    if(del){
      d.mults.splice(+del.dataset.delmult,1);
      if(!d.mults.length) d.mults.push({v:0,n:0});
      drawMults(d); ctx.refresh(); return true;
    }
    return false;
  },
  onInput(e, ctx){
    const d = ctx.d;
    if(e.target.dataset.mv !== undefined){ d.mults[+e.target.dataset.mv].v = Math.max(0, +e.target.value||0); ctx.refresh(); return true; }
    if(e.target.dataset.mn !== undefined){ d.mults[+e.target.dataset.mn].n = Math.max(0, +e.target.value||0); ctx.refresh(); return true; }
    return false;
  }
});
</script>
